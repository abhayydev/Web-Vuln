[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webvuln-scanner"
version = "0.1.0"
description = "Advanced Automated Web Vulnerability Scanner"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "beautifulsoup4+>4.12.0",
    "jinja2>=3.1.3"
]

[project.scripts]
webvuln = "webvuln.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
